<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Streaming</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0D1117;
color:#fff;
padding:18px;
}

.container{
max-width:500px;
margin:auto;
}

.search-box{
background:#161B22;
border:1px solid #30363D;
border-radius:16px;
display:flex;
align-items:center;
padding:14px;
margin-bottom:16px;
}

.search-box input{
background:none;
border:none;
outline:none;
color:white;
width:100%;
font-size:15px;
margin-left:10px;
}

.toggle{
display:flex;
gap:10px;
margin-bottom:20px;
}

.toggle button{
flex:1;
border:none;
background:#161B22;
color:#8B949E;
padding:13px;
border-radius:14px;
cursor:pointer;
font-size:14px;
transition:.3s;
}

.toggle button.active{
background:#7C5CFF;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#161B22;
border-radius:18px;
overflow:hidden;
transition:.3s;
cursor:pointer;
}

.card:hover{
transform:scale(1.03);
}

.poster{
position:relative;
}

.poster img{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
display:block;
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:58px;
height:58px;
border-radius:50%;
background:rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
backdrop-filter:blur(6px);
}

.info{
padding:12px;
}

.title{
font-weight:600;
font-size:15px;
}

.sub{
font-size:13px;
color:#8B949E;
margin-top:5px;
}

.list{
display:none;
flex-direction:column;
gap:15px;
}

.list .card{
display:flex;
}

.list img{
width:110px;
height:160px;
object-fit:cover;
}

.list .info{
display:flex;
flex-direction:column;
justify-content:center;
}

</style>
</head>

<body>

<div class="container">

<div class="search-box">
🔍
<input type="text" id="search" placeholder="Cari film...">
</div>

<div class="toggle">
<button class="active" id="gridBtn">▦ Grid</button>
<button id="listBtn">☰ List</button>
</div>

<div class="grid" id="gridView">

<div class="card">
<div class="poster">
<img src="https://picsum.photos/300/450?1">
<div class="play">▶</div>
</div>
<div class="info">
<div class="title">Movie One</div>
<div class="sub">Episode 12</div>
</div>
</div>

<div class="card">
<div class="poster">
<img src="https://picsum.photos/300/450?2">
<div class="play">▶</div>
</div>
<div class="info">
<div class="title">Movie Two</div>
<div class="sub">Episode 8</div>
</div>
</div>

<div class="card">
<div class="poster">
<img src="https://picsum.photos/300/450?3">
<div class="play">▶</div>
</div>
<div class="info">
<div class="title">Movie Three</div>
<div class="sub">Episode 6</div>
</div>
</div>

<div class="card">
<div class="poster">
<img src="https://picsum.photos/300/450?4">
<div class="play">▶</div>
</div>
<div class="info">
<div class="title">Movie Four</div>
<div class="sub">Episode 3</div>
</div>
</div>

</div>

<div class="list" id="listView">

<div class="card">
<img src="https://picsum.photos/300/450?1">
<div class="info">
<div class="title">Movie One</div>
<div class="sub">Episode 12</div>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?2">
<div class="info">
<div class="title">Movie Two</div>
<div class="sub">Episode 8</div>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?3">
<div class="info">
<div class="title">Movie Three</div>
<div class="sub">Episode 6</div>
</div>
</div>

</div>

</div>

<script>

const gridBtn=document.getElementById("gridBtn");
const listBtn=document.getElementById("listBtn");

const grid=document.getElementById("gridView");
const list=document.getElementById("listView");

gridBtn.onclick=()=>{
grid.style.display="grid";
list.style.display="none";
gridBtn.classList.add("active");
listBtn.classList.remove("active");
}

listBtn.onclick=()=>{
grid.style.display="none";
list.style.display="flex";
listBtn.classList.add("active");
gridBtn.classList.remove("active");
}

document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toLowerCase();

document.querySelectorAll(".card").forEach(card=>{

let title=card.innerText.toLowerCase();

card.style.display=title.includes(value)?"":"none";

});

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dark Video Mini App</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #0d0f12;
      --card: #15181d;
      --card-soft: #1b1f25;
      --border: #252a31;
      --text: #f3f4f6;
      --muted: #8d949e;
      --accent: #8b7cff;
      --accent-soft: #292445;
      --danger: #272b32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding: 18px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      font-size: 18px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    /* SEARCH */

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 13px;
      color: var(--muted);
    }

    /* FILTER */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .toolbar h2 {
      font-size: 16px;
    }

    .view-buttons {
      display: flex;
      gap: 6px;
    }

    .view-buttons button {
      width: 36px;
      height: 34px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
    }

    .view-buttons button.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* GRID */

    .video-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .video-container.list {
      grid-template-columns: 1fr;
    }

    .video-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .video-card:hover {
      transform: translateY(-2px);
      border-color: #3a404b;
    }

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #222;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-button {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
    }

    .video-info {
      padding: 12px;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .video-description {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    /* LIST MODE */

    .video-container.list .video-card {
      display: flex;
      align-items: center;
    }

    .video-container.list .thumbnail {
      width: 130px;
      min-width: 130px;
      aspect-ratio: 16 / 10;
    }

    .video-container.list .video-info {
      padding: 12px;
    }

    /* DETAIL PAGE */

    .detail-page {
      display: none;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
    }

    .detail-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .detail-title {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .detail-description {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .watch-button {
      background: var(--accent);
      color: white;
    }

    .watch-button:hover {
      opacity: 0.9;
    }

    .share-button {
      background: var(--card-soft);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
      display: none;
    }

    @media (max-width: 380px) {
      .video-container {
        gap: 10px;
      }

      .video-info {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HOME PAGE -->
    <section id="homePage">

      <header class="header">
        <div class="brand">
          <div class="brand-icon">▶</div>

          <div>
            <h1>Video Room</h1>
            <p>Explore your favorite videos</p>
          </div>
        </div>
      </header>

      <!-- SEARCH -->
      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          type="text"
          id="searchInput"
          placeholder="Cari video..."
        />
      </div>

      <!-- TOOLBAR -->
      <div class="toolbar">
        <h2>Explore</h2>

        <div class="view-buttons">
          <button id="gridButton" class="active">▦</button>
          <button id="listButton">☷</button>
        </div>
      </div>

      <!-- VIDEO LIST -->
      <div id="videoContainer" class="video-container"></div>

      <div id="emptyState" class="empty">
        Video tidak ditemukan.
      </div>

    </section>


    <!-- DETAIL PAGE -->
    <section id="detailPage" class="detail-page">

      <div class="back-button" onclick="goBack()">
        ← Kembali
      </div>

      <img
        id="detailImage"
        class="detail-image"
        src=""
        alt="Video"
      />

      <h1 id="detailTitle" class="detail-title"></h1>

      <p id="detailDescription" class="detail-description"></p>

      <div class="actions">

        <button
          class="action-button watch-button"
          onclick="watchNow()"
        >
          ▶ Tonton Sekarang
        </button>

        <button
          class="action-button share-button"
          onclick="shareVideo()"
        >
          ↗ Bagikan ke Teman
        </button>

      </div>

    </section>

  </main>


  <script>

    /*
    ========================================
    DATA VIDEO
    ========================================
    */

    const videos = [

      {
        id: 1,
        title: "Night Drive",
        description: "Nikmati suasana perjalanan malam dengan visual yang tenang dan cinematic.",
        image: "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800",
        video: "https://example.com/video-1.mp4"
      },

      {
        id: 2,
        title: "Ocean Waves",
        description: "Video dengan suasana laut yang tenang untuk menemani waktu santai.",
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800",
        video: "https://example.com/video-2.mp4"
      },

      {
        id: 3,
        title: "City Lights",
        description: "Pemandangan kota di malam hari dengan suasana modern dan elegan.",
        image: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800",
        video: "https://example.com/video-3.mp4"
      },

      {
        id: 4,
        title: "Mountain View",
        description: "Pemandangan pegunungan yang indah dan menenangkan.",
        image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800",
        video: "https://example.com/video-4.mp4"
      }

    ];


    let selectedVideo = null;


    /*
    ========================================
    RENDER VIDEO
    ========================================
    */

    function renderVideos(data = videos) {

      const container = document.getElementById("videoContainer");
      const emptyState = document.getElementById("emptyState");

      container.innerHTML = "";

      if (data.length === 0) {

        emptyState.style.display = "block";

        return;

      }

      emptyState.style.display = "none";


      data.forEach(video => {

        const card = document.createElement("div");

        card.className = "video-card";

        card.innerHTML = `

          <div class="thumbnail">

            <img
              src="${video.image}"
              alt="${video.title}"
            />

            <div class="play-button">
              ▶
            </div>

          </div>

          <div class="video-info">

            <div class="video-title">
              ${video.title}
            </div>

            <div class="video-description">
              ${video.description}
            </div>

          </div>

        `;

        card.onclick = () => openDetail(video.id);

        container.appendChild(card);

      });

    }


    /*
    ========================================
    OPEN DETAIL
    ========================================
    */

    function openDetail(id) {

      selectedVideo = videos.find(video => video.id === id);

      document.getElementById("homePage").style.display = "none";

      document.getElementById("detailPage").style.display = "block";

      document.getElementById("detailImage").src =
        selectedVideo.image;

      document.getElementById("detailTitle").textContent =
        selectedVideo.title;

      document.getElementById("detailDescription").textContent =
        selectedVideo.description;

    }


    /*
    ========================================
    BACK TO HOME
    ========================================
    */

    function goBack() {

      document.getElementById("detailPage").style.display = "none";

      document.getElementById("homePage").style.display = "block";

    }


    /*
    ========================================
    SEARCH
    ========================================
    */

    document
      .getElementById("searchInput")
      .addEventListener("input", function () {

        const keyword = this.value.toLowerCase();

        const filteredVideos = videos.filter(video =>

          video.title.toLowerCase().includes(keyword) ||

          video.description.toLowerCase().includes(keyword)

        );

        renderVideos(filteredVideos);

      });


    /*
    ========================================
    GRID / LIST VIEW
    ========================================
    */

    const videoContainer =
      document.getElementById("videoContainer");

    const gridButton =
      document.getElementById("gridButton");

    const listButton =
      document.getElementById("listButton");


    gridButton.onclick = () => {

      videoContainer.classList.remove("list");

      gridButton.classList.add("active");

      listButton.classList.remove("active");

    };


    listButton.onclick = () => {

      videoContainer.classList.add("list");

      listButton.classList.add("active");

      gridButton.classList.remove("active");

    };


    /*
    ========================================
    TONTON SEKARANG
    ========================================
    */

    function watchNow() {

      if (!selectedVideo) return;


      /*
      TELEGRAM MINI APP

      Data dikirim ke bot:

      {
        action: "watch",
        video_id: 1
      }

      */

      const data = {

        action: "watch",

        video_id: selectedVideo.id

      };


      if (
        window.Telegram &&
        window.Telegram.WebApp
      ) {

        Telegram.WebApp.sendData(
          JSON.stringify(data)
        );

        Telegram.WebApp.close();

      } else {

        /*
        Untuk testing di browser biasa
        */

        alert(
          "Video dipilih: " +
          selectedVideo.title
        );

      }

    }


    /*
    ========================================
    BAGIKAN KE TEMAN
    ========================================
    */

    function shareVideo() {

      if (!selectedVideo) return;


      const shareText =
        `Lihat video ini: ${selectedVideo.title}`;


      if (
        navigator.share
      ) {

        navigator.share({

          title: selectedVideo.title,

          text: shareText,

          url: window.location.href

        });

      } else {

        navigator.clipboard.writeText(
          window.location.href
        );

        alert(
          "Link berhasil disalin."
        );

      }

    }


    /*
    ========================================
    INITIAL RENDER
    ========================================
    */

    renderVideos();


    /*
    ========================================
    TELEGRAM MINI APP SETUP
    ========================================
    */

    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      Telegram.WebApp.ready();

      Telegram.WebApp.expand();

    }

  </script>

</body>
</html>
